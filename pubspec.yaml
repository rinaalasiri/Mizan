name: mizan
description: Local-first personal finance tracker for Flutter Web.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  sqflite: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  fl_chart: ^1.3.0
  intl: ^0.20.3
  csv: ^6.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  web: ^1.1.1
dev_dependencies:
  sqflite_common_ffi: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/NotoSansArabic.ttf



hooks:
  user_defines:
    sqlite3:
      source: system
      name:
        windows: winsqlite3
        default: sqlite3
