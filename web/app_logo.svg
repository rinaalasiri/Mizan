<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Subtle highlight -->
  <circle cx="200" cy="140" r="360" fill="#FFFFFF" opacity="0.06"/>

  <!-- Ascending bars (analytics / savings growth) -->
  <rect x="236" y="560" width="144" height="224" rx="36" fill="url(#bar)" opacity="0.75"/>
  <rect x="440" y="470" width="144" height="314" rx="36" fill="url(#bar)" opacity="0.9"/>
  <rect x="644" y="360" width="144" height="424" rx="36" fill="url(#bar)"/>

  <!-- Baseline -->
  <rect x="196" y="816" width="632" height="24" rx="12" fill="#FFFFFF" opacity="0.35"/>

  <!-- Coin -->
  <circle cx="716" cy="250" r="112" fill="#000000" opacity="0.18" transform="translate(0 10)"/>
  <circle cx="716" cy="250" r="112" fill="url(#coin)"/>
  <circle cx="716" cy="250" r="82" fill="none" stroke="#B45309" stroke-width="10" opacity="0.55"/>
  <!-- Coin mark: upward chevron -->
  <path d="M672 282 L716 226 L760 282" fill="none" stroke="#92400E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M672 244 L716 188 L760 244" fill="none" stroke="#92400E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
